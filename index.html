<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b12f27">
<title>B.B GARÇOM — B.B CHURRASCO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--brand:#b12f29;--brand-dark:#8f241f;--ink:#14281e;--bg:#f8faf9;--card:#ffffff;--border:#e3e8e5}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{padding-bottom:110px}.app{max-width:760px;margin:auto;padding:16px 16px 110px}
.header{background:linear-gradient(135deg,#c43831,#92241e);color:#fff;border-radius:24px;padding:22px 20px;box-shadow:0 14px 30px rgba(177,47,41,.2);position:relative;overflow:hidden}
.header:after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-50px;top:-60px;background:rgba(255,255,255,.08)}
.header h1{font-size:26px;font-weight:900;letter-spacing:-.5px;margin:0}.header p{margin:4px 0 0;font-size:13px;opacity:.9}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 12px}.section-title h2{font-size:20px;font-weight:900;color:var(--ink);margin:0}.muted{color:#6c7a72;font-size:13px}
.bottom{position:fixed;z-index:100;left:50%;bottom:12px;transform:translateX(-50%);width:min(730px,calc(100% - 24px));background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border:1px solid rgba(227,232,229,.8);display:grid;grid-template-columns:repeat(3,1fr);padding:8px;border-radius:24px;box-shadow:0 10px 30px rgba(20,40,30,.12)}
.bottom button{border:0;background:none;color:#75857c;font-weight:800;font-size:12px;padding:10px 6px;border-radius:16px;display:flex;flex-direction:column;align-items:center;transition:.2s}.bottom button.active{color:var(--brand);background:#fff1f0}.bottom .ico{font-size:20px;margin-bottom:2px}
.tables{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.table{min-height:120px;border-radius:22px;padding:14px 10px;border:2px solid #52b761;background:#f1fbf3;color:#184a27;box-shadow:0 6px 16px rgba(40,110,60,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.15s}.table:active{transform:scale(.96)}.table.busy{border-color:#e05650;background:#fff2f1;color:#8f241f;box-shadow:0 6px 16px rgba(177,47,41,.06)}.table .num{font-size:19px;font-weight:900}.table .status{font-size:11px;font-weight:900;margin-top:4px;letter-spacing:.3px}.table .total{font-size:13px;font-weight:900;margin-top:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:0 8px 24px rgba(20,40,30,.05);padding:18px;margin-bottom:14px}.topbar{display:flex;gap:12px;align-items:center}.back{border:0;background:#edf2ef;border-radius:14px;width:40px;height:40px;font-weight:900;font-size:16px;display:grid;place-items:center;cursor:pointer}.mesa-head{flex:1}.mesa-head h2{font-size:20px;font-weight:900;color:var(--ink);margin:0}.mesa-head p{margin:2px 0 0;font-size:12px;color:#6c7a72}
.people{margin-top:14px;padding:14px 16px;border-radius:18px;background:#f4f7f5;display:flex;align-items:center;justify-content:space-between}.people input{width:75px;border:1px solid #d4ddd8;border-radius:12px;padding:10px;text-align:center;font-weight:900;background:#fff;font-size:15px}
.cats{display:flex;gap:8px;overflow:auto;padding:4px 2px 12px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:var(--bg)}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:1px solid var(--border);background:#fff;color:#526159;border-radius:999px;padding:10px 16px;font-weight:800;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.02);cursor:pointer}.cat.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 4px 12px rgba(177,47,41,.3)}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{overflow:hidden;border-radius:20px;background:#fff;border:1px solid var(--border);box-shadow:0 6px 18px rgba(20,30,20,.04)}.prod-img{height:100px;display:grid;place-items:center;background:linear-gradient(135deg,#f2f5f3,#e6ebe8);font-size:44px}.prod-body{padding:12px}.prod-name{font-size:14px;font-weight:900;line-height:1.25;min-height:35px}.price{font-size:13px;font-weight:900;color:var(--brand);margin:6px 0 10px}.qty{display:flex;align-items:center;justify-content:space-between;gap:6px}.qty button{width:36px;height:36px;border:0;border-radius:12px;background:#edf2ef;font-weight:900;font-size:18px;cursor:pointer}.qty button.plus{background:var(--brand);color:#fff}.qty span{font-weight:900;min-width:22px;text-align:center;font-size:15px}.selected{outline:2px solid #52b761;outline-offset:-2px}
.cartbar{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:82px;width:min(720px,calc(100% - 24px));background:#14281e;color:#fff;border-radius:20px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(20,40,30,.3)}.cartbar button{border:0;background:#fff;color:#14281e;border-radius:14px;padding:10px 16px;font-weight:900;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.5);backdrop-filter:blur(4px);z-index:200;display:none;align-items:end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto auto 0;border-radius:28px 28px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet h2{font-size:20px;font-weight:900;color:var(--ink);margin:0}.close{border:0;background:#edf2ef;border-radius:12px;width:38px;height:38px;font-size:18px;cursor:pointer}.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #f0f4f1}.line small{color:#6c7a72}.totalrow{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:16px 0;border-top:2px dashed #edf2ef;margin-top:6px}.primary{width:100%;border:0;background:var(--brand);color:#fff;border-radius:16px;padding:15px;font-weight:900;font-size:15px;box-shadow:0 6px 18px rgba(177,47,41,.25);cursor:pointer}.secondary{width:100%;border:0;background:#edf2ef;color:#183625;border-radius:16px;padding:14px;font-weight:900;margin-top:8px;cursor:pointer}
.empty{padding:40px 20px;text-align:center;color:#75857c;font-weight:700}.command{padding:18px;margin-bottom:12px}.command .row{display:flex;justify-content:space-between;gap:10px}.command h3{margin:0;font-size:17px;font-weight:900;color:var(--ink)}.tag{font-size:11px;font-weight:900;border-radius:999px;padding:5px 10px;background:#fff1f0;color:var(--brand)}
@media(max-width:420px){.tables{gap:8px}.table{min-height:110px}.products{gap:8px}.prod-img{height:90px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <h1>B.B CHURRASCO</h1>
  <p>B.B GARÇOM — Sistema de Atendimento</p>
</header>
<div id="conteudo"></div>
</div>

<div id="cartBar" class="cartbar" style="display:none">
  <div><strong id="cartCount">0 itens</strong><br><span id="cartTotal">R$ 0,00</span></div>
  <button onclick="abrirCarrinho()">Ver pedido →</button>
</div>

<nav class="bottom">
 <button id="navMesas" onclick="mudarTela('mesas')"><span class="ico">🪑</span>Mesas</button>
 <button id="navComandas" onclick="mudarTela('comandas')"><span class="ico">📋</span>Comandas</button>
 <button id="navRelatorios" onclick="mudarTela('relatorios')"><span class="ico">📊</span>Relatórios</button>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this)fecharModal()">
 <div class="sheet">
  <div class="sheet-head"><h2 id="modalTitle">Pedido</h2><button class="close" onclick="fecharModal()">×</button></div>
  <div id="modalBody"></div>
 </div>
</div>

<script>
const cardapio={
"CHURRASCOS":[
["Frango",8,"🍗"],["Porco",8,"🥩"],["Linguiça",8,"🌭"],["Coração de frango",8,"🍢"],["Coração de boi",8,"🍢"],["Carne",8,"🥩"],["Tripa",8,"🥓"]],
"CARANGUEJO":[["Unidade",8,"🦀"],["Combo 4",28,"🦀"]],
"BEBIDAS":[["Skol",5,"🍺"],["Litro da amarela",35,"🍺"],["Litro da prata",30,"🍺"],["Brahma Chopp",5,"🍺"],["Brahma Puro Malte",5,"🍺"],["Heineken",9,"🍺"],["Corona Extra",10,"🍺"],["Terça amarela",7,"🍻"],["Terça prata",6,"🍻"],["Meio litro amarela",16,"🍺"],["Meio litro prata",15,"🍺"],["Balde Skol",50,"🪣"],["Balde Brahma",50,"🪣"],["Budweiser",7.5,"🍺"],["Vinho",7,"🍷"],["Caipirinha",15,"🍹"]],
"SUCOS":[["Suco Maracujá 400ml",8,"🧃"],["Suco Manga 400ml",7,"🧃"],["Suco Goiaba 400ml",7,"🧃"]],
"REFRIGERANTES":[["Coca-Cola 1L",8,"🥤"],["Guaraná 1L",7,"🥤"],["Pepsi 1L",7,"🥤"],["Coca-Cola lata",5,"🥫"],["Fanta lata",5,"🥫"],["Sprite lata",6,"🥫"],["Água",3,"💧"],["Água com gás",4,"💧"]],
"PETISCOS":[["Batata frita",15,"🍟"],["Calabresa acebolada",15,"🍳"],["Camarão (porção)",25,"🍤"]],
"GUARNIÇÕES":[["Baião caseiro grande",8,"🍚"],["Baião caseiro pequeno",4,"🍚"],["Baião cremoso grande",10,"🍲"],["Baião cremoso pequeno",5,"🍲"]]
};
let comandas=JSON.parse(localStorage.getItem("bb_comandas"))||{};
let historicoVendas=JSON.parse(localStorage.getItem("bb_historico"))||[];
let despesas=JSON.parse(localStorage.getItem("bb_despesas"))||[];
let telaAtual="mesas",mesaSelecionada=null,pedidoTemp={},pessoasTemp=1,categoriaAtual="CHURRASCOS";

const br=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad=n=>String(n).padStart(2,"0");
function persist(){
  localStorage.setItem("bb_comandas",JSON.stringify(comandas));
  localStorage.setItem("bb_historico",JSON.stringify(historicoVendas));
  localStorage.setItem("bb_despesas",JSON.stringify(despesas));
}
function mudarTela(t,num=null){telaAtual=t;if(num!==null)mesaSelecionada=Number(num);renderizar();scrollTo(0,0)}
function abrirMesa(num){mesaSelecionada=Number(num);pedidoTemp={};pessoasTemp=1;if(comandas[num]){pessoasTemp=comandas[num].pessoas||1;(comandas[num].itens||[]).forEach(i=>pedidoTemp[i.nome]=i.qtd)}mudarTela("atendimento",num)}
function atualizarPessoas(v){pessoasTemp=Math.max(1,parseInt(v)||1)}
function alterarQtd(nome,delta){pedidoTemp[nome]=(pedidoTemp[nome]||0)+delta;if(pedidoTemp[nome]<0)pedidoTemp[nome]=0;renderProdutos();atualizarBar()}
function produtosFlat(){let a=[];for(const cat in cardapio)cardapio[cat].forEach(p=>a.push({nome:p[0],preco:p[1],icon:p[2],cat}));return a}
function totalTemp(){return produtosFlat().reduce((s,p)=>s+(pedidoTemp[p.nome]||0)*p.preco,0)}
function itensTemp(){return produtosFlat().filter(p=>(pedidoTemp[p.nome]||0)>0).map(p=>({nome:p.nome,qtd:pedidoTemp[p.nome],preco:p.preco}))}
function atualizarBar(){const items=Object.values(pedidoTemp).reduce((a,b)=>a+b,0),total=totalTemp();const bar=document.getElementById("cartBar");if(telaAtual==="atendimento"&&items){bar.style.display="flex";document.getElementById("cartCount").textContent=`${items} ${items===1?"item":"itens"}`;document.getElementById("cartTotal").textContent=br(total)}else bar.style.display="none"}
function setCategoria(cat){categoriaAtual=cat;renderProdutos()}
function renderProdutos(){
 const el=document.getElementById("produtos");if(!el)return;
 el.innerHTML=cardapio[categoriaAtual].map(p=>{const [nome,preco,icon]=p,q=pedidoTemp[nome]||0;return `<div class="product ${q?"selected":""}">
 <div class="prod-img">${icon}</div><div class="prod-body"><div class="prod-name">${nome}</div><div class="price">${br(preco)}</div>
 <div class="qty"><button onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',-1)">−</button><span>${q}</span><button class="plus" onclick="alterarQtd('${nome.replace(/'/g,"\\'")}',1)">+</button></div></div></div>`}).join("");
 document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x.dataset.cat===categoriaAtual));atualizarBar();
}
function renderAtendimento(){
 const total=totalTemp();
 document.getElementById("conteudo").innerHTML=`<div class="section-title"><div class="topbar" style="width:100%"><button class="back" onclick="mudarTela('mesas')">←</button><div class="mesa-head"><h2>Mesa ${pad(mesaSelecionada)}</h2><p>Atendimento e lançamento</p></div><span class="tag">${br(total)}</span></div></div>
 <div class="card people"><span><b>👥 Pessoas na mesa</b><br><small class="muted">Informe para divisão de conta</small></span><input id="pessoas" type="number" min="1" value="${pessoasTemp}" onchange="atualizarPessoas(this.value)"></div>
 <div class="section-title"><h2>Cardápio</h2><span class="muted">${itensTemp().reduce((s,i)=>s+i.qtd,0)} itens</span></div>
 <div class="cats">${Object.keys(cardapio).map(c=>`<button class="cat ${c===categoriaAtual?"active":""}" data-cat="${c}" onclick="setCategoria('${c}')">${c==="CHURRASCOS"?"🔥":c==="CARANGUEJO"?"🦀":c==="BEBIDAS"?"🍺":c==="SUCOS"?"🧃":c==="REFRIGERANTES"?"🥤":c==="PETISCOS"?"🍟":"🍚"} ${c}</button>`).join("")}</div>
 <div id="produtos" class="products"></div>`;
 renderProdutos();
}
function salvarComanda(){
 const itens=itensTemp();if(!itens.length){alert("Adicione pelo menos um produto.");return}
 const total=itens.reduce((s,i)=>s+i.qtd*i.preco,0);
 comandas[mesaSelecionada]={pessoas:pessoasTemp,itens,total,atualizadoEm:Date.now()};
 persist();fecharModal();alert(`Mesa ${pad(mesaSelecionada)} salva com sucesso!`);mudarTela("mesas");
}
function abrirCarrinho(){const itens=itensTemp();document.getElementById("modalTitle").textContent=`Mesa ${pad(mesaSelecionada)} — Pedido`;document.getElementById("modalBody").innerHTML=`${itens.map(i=>`<div class="line"><div><b>${i.qtd}x ${i.nome}</b><br><small>${br(i.preco)} cada</small></div><strong>${br(i.qtd*i.preco)}</strong></div>`).join("")}<div class="totalrow"><span>Total</span><span>${br(totalTemp())}</span></div><button class="primary" onclick="salvarComanda()">💾 Salvar comanda</button><button class="secondary" onclick="fecharModal()">Continuar adicionando</button>`;document.getElementById("modal").classList.add("show")}
function fecharModal(){document.getElementById("modal").classList.remove("show")}

function dividirContaModal(num){
 const c=comandas[num];if(!c)return;
 let qtdPessoas=c.pessoas||1;
 let porPessoa=c.total/qtdPessoas;
 document.getElementById("modalTitle").textContent=`Divisão da Mesa ${pad(num)}`;
 document.getElementById("modalBody").innerHTML=`
  <div style="text-align:center;margin-bottom:14px">
    <div style="font-size:13px;color:#6c7a72">Total Restante da Comanda</div>
    <div id="valTotalComanda" style="font-size:24px;font-weight:900;color:var(--brand)">${br(c.total)}</div>
  </div>
  <div class="card" style="background:#f4f7f5;padding:14px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>Dividir entre quantas pessoas?</b>
      <input id="divPessoas" type="number" min="1" value="${qtdPessoas}" oninput="atualizarCalculoDivisao(${c.total},this.value)" style="width:70px;border:1px solid #d4ddd8;border-radius:10px;padding:8px;text-align:center;font-weight:900;background:#fff">
    </div>
  </div>
  <div id="resDivisao" class="card" style="background:#fff1f0;border-color:#f8d7d5;text-align:center;padding:16px;margin-bottom:14px">
    <div style="font-size:13px;color:#8f241f;font-weight:800">VALOR POR PESSOA</div>
    <div style="font-size:30px;font-weight:900;color:#b12f29;margin-top:4px">${br(porPessoa)}</div>
  </div>
  <button class="primary" style="background:#2e7d32;margin-bottom:8px" onclick="pagarParteMesa(${num})">💵 Pagar 1 Pessoa (Abater do Total)</button>
  <button class="primary" onclick="fecharMesaDireto(${num})">✅ Fechar Mesa Completa (${br(c.total)})</button>
  <button class="secondary" onclick="fecharModal()">Voltar</button>`;
 document.getElementById("modal").classList.add("show");
}

function atualizarCalculoDivisao(total, qtd){
 let q=Math.max(1,parseInt(qtd)||1);
 let val=total/q;
 document.getElementById("resDivisao").innerHTML=`
  <div style="font-size:13px;color:#8f241f;font-weight:800">VALOR POR PESSOA</div>
  <div style="font-size:30px;font-weight:900;color:#b12f29;margin-top:4px">${br(val)}</div>`;
}

function fecharMesa(num){
 dividirContaModal(num);
}

function pagarParteMesa(num){
 const c=comandas[num];if(!c)return;
 let qtdPessoas=Math.max(1,parseInt(document.getElementById("divPessoas").value)||1);
 let valorPorPessoa=c.total/qtdPessoas;

 if(confirm(`Confirmar o recebimento de ${br(valorPorPessoa)} (1 pessoa)? O valor será enviado ao relatório e o restante continuará aberto na mesa.`)){
   historicoVendas.push({mesa:num,total:valorPorPessoa,itens:[{nome:"Pagamento Parcial / Porção",qtd:1,preco:valorPorPessoa}],horario:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
   
   c.total-=valorPorPessoa;
   c.pessoas=Math.max(1,qtdPessoas-1);

   if(c.total<=0.5){
     delete comandas[num];
     alert("Comanda totalmente quitada e fechada!");
   } else {
     persist();
     alert(`Pagamento de ${br(valorPorPessoa)} registrado! Restam ${br(c.total)} na mesa.`);
   }
   
   persist();
   fecharModal();
   renderizar();
 }
}

function fecharMesaDireto(num){
 const c=comandas[num];if(!c)return;
 if(confirm(`Deseja realmente fechar a Mesa ${pad(num)} e enviar ${br(c.total)} para o Relatório do Dia?`)){
   historicoVendas.push({mesa:num,total:c.total,itens:c.itens,horario:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
   delete comandas[num];
   persist();
   fecharModal();
   renderizar();
 }
}

function adicionarDespesa(){
  let desc=prompt("Nome da despesa (ex: Gelo, Carvão, Carne):");
  if(!desc)return;
  let valor=prompt("Valor da despesa em R$ (ex: 45.00):");
  valor=parseFloat(valor.replace(",","."));
  if(isNaN(valor)||valor<=0){alert("Valor inválido.");return;}
  despesas.push({desc,valor,horario:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
  persist();
  renderRelatorios();
}
function limparRelatorios(){
  if(confirm("Deseja zerar todo o histórico de vendas e despesas do dia?")){
    historicoVendas=[]; despesas=[]; persist(); renderRelatorios();
  }
}
function renderMesas(){
 let abertas=Object.keys(comandas).filter(k=>comandas[k]?.itens?.length).length;
 document.getElementById("conteudo").innerHTML=`<div class="section-title"><div><h2>Mesas</h2><span class="muted">${abertas} aberta${abertas===1?"":"s"} no salão</span></div><span class="tag">30 mesas</span></div>
 <div class="tables">${Array.from({length:30},(_,i)=>{let n=i+1,c=comandas[n],busy=c?.itens?.length;return `<div class="table ${busy?"busy":""}" onclick="abrirMesa(${n})"><div class="num">Mesa ${pad(n)}</div><div class="status">${busy?"OCUPADA":"LIVRE"}</div>${busy?`<div class="total">${br(c.total)}</div><div style="font-size:10px;margin-top:2px">${c.pessoas||1} pes.</div>`:""}</div>`}).join("")}</div>`;
}
function renderComandas(){
 let abertas=Object.entries(comandas).filter(([m,c])=>c?.itens?.length);
 document.getElementById("conteudo").innerHTML=`<div class="section-title"><div><h2>Comandas Abertas</h2><span class="muted">${abertas.length} mesa${abertas.length===1?"":"s"} ativa${abertas.length===1?"":"s"}</span></div></div>
 ${abertas.length?abertas.map(([m,c])=>`<div class="card command"><div class="row"><h3>Mesa ${pad(m)}</h3><strong style="color:var(--brand);font-size:18px">${br(c.total)}</strong></div><p class="muted" style="font-size:12px;margin:4px 0 12px">👥 ${c.pessoas||1} pessoa${(c.pessoas||1)>1?"s":''} • Média por pessoa: ${br(c.total/(c.pessoas||1))}</p>${c.itens.map(i=>`<div class="row" style="font-size:13px;margin:5px 0"><span>${i.qtd}x ${i.nome}</span><b>${br(i.qtd*i.preco)}</b></div>`).join("")}<div style="display:flex;gap:8px;margin-top:14px"><button class="secondary" style="margin:0" onclick="abrirMesa(${m})">✏️ Editar / Adicionar</button><button class="primary" style="background:#b12f29" onclick="fecharMesa(${m})">💰 Dividir / Fechar</button></div></div>`).join(""):`<div class="card empty">📋<br><b>Nenhuma comanda aberta</b><br>As mesas em atendimento aparecerão aqui.</div>`}`;
}
function renderRelatorios(){
 let totalFaturamento=historicoVendas.reduce((s,v)=>s+v.total,0);
 let totalDespesas=despesas.reduce((s,d)=>s+d.valor,0);
 let lucroLiquido=totalFaturamento-totalDespesas;

 let itensContador={};
 historicoVendas.forEach(v=>v.itens.forEach(i=>{
  if(!itensContador[i.nome])itensContador[i.nome]={qtd:0,preco:i.preco};
  itensContador[i.nome].qtd+=i.qtd;
 }));
 let listaItens=Object.entries(itensContador);

 document.getElementById("conteudo").innerHTML=`
  <div class="section-title"><div><h2>Relatório Financeiro</h2><span class="muted">Resumo do Dia</span></div><button onclick="limparRelatorios()" style="border:0;background:#feeceb;color:#a92d25;border-radius:12px;padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer">🗑️ Resetar Dia</button></div>
  
  <div class="card" style="background:linear-gradient(135deg,#14281e,#1f3d2e);color:#fff">
    <div style="font-size:13px;opacity:.85">Lucro Líquido (Faturamento - Gastos)</div>
    <div style="font-size:30px;font-weight:900;margin-top:4px">${br(lucroLiquido)}</div>
    <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px">
      <div>📈 Faturamento: <br><b style="font-size:14px">${br(totalFaturamento)}</b></div>
      <div>📉 Total Gastos: <br><b style="font-size:14px">${br(totalDespesas)}</b></div>
    </div>
  </div>

  <div style="margin-bottom:14px">
    <button class="primary" onclick="adicionarDespesa()">➕ Registrar Gasto / Despesa</button>
  </div>

  <div class="section-title"><h2>Gastos Registrados</h2></div>
  <div class="card">
    ${despesas.length?despesas.map((d,i)=>`<div class="line"><div><b>${d.desc}</b><br><small>${d.horario}</small></div><strong style="color:#b12f29">- ${br(d.valor)}</strong></div>`).join(""):`<div class="empty" style="padding:15px">Nenhum gasto registrado hoje.</div>`}
  </div>

  <div class="section-title"><h2>Produtos Vendidos (Histórico)</h2></div>
  <div class="card">
    ${listaItens.length?listaItens.map(([nome,info])=>`<div class="line"><div><b>${info.qtd}x ${nome}</b></div><strong>${br(info.qtd*info.preco)}</strong></div>`).join(""):`<div class="empty" style="padding:15px">Nenhuma venda finalizada ainda.</div>`}
  </div>`;
}
function renderizar(){
 const navM=document.getElementById("navMesas"),navC=document.getElementById("navComandas"),navR=document.getElementById("navRelatorios");
 navM.classList.toggle("active",telaAtual==="mesas"||telaAtual==="atendimento");
 navC.classList.toggle("active",telaAtual==="comandas");
 navR.classList.toggle("active",telaAtual==="relatorios");
 if(telaAtual==="mesas")renderMesas();
 else if(telaAtual==="atendimento")renderAtendimento();
 else if(telaAtual==="comandas")renderComandas();
 else if(telaAtual==="relatorios")renderRelatorios();
 atualizarBar();
}
renderizar();
</script>
</body>
</html>
