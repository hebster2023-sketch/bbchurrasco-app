<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBchurrasco - Sistema de Comandas</title>
    <style>
        :root {
            --primary: #d97706;
            --primary-dark: #b45309;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --danger: #ef4444;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }
        .hidden { display: none !important; }
        
        #login-screen {
            max-width: 400px; margin: 80px auto; background: var(--card-bg);
            padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #login-screen h2 { text-align: center; margin-bottom: 20px; color: var(--primary-dark); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 16px; }
        .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: var(--primary-dark); }
        .error-msg { color: var(--danger); font-size: 14px; text-align: center; margin-top: 10px; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .user-info span { font-weight: bold; color: var(--primary-dark); }
        .btn-logout { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        
        .actions-bar { margin-bottom: 20px; display: flex; gap: 10px; }
        .btn-new { background: var(--success); flex: 1; padding: 12px; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }

        .comandas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .comanda-card { background: var(--card-bg); border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); position: relative; }
        .comanda-card.pago { border-left-color: var(--success); opacity: 0.7; }
        .comanda-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .comanda-mesa { font-size: 18px; font-weight: bold; }
        .comanda-status { font-size: 12px; padding: 3px 8px; border-radius: 12px; font-weight: bold; text-transform: uppercase; }
        .status-aberto { background: #fef3c7; color: #d97706; }
        .status-pago { background: #d1fae5; color: #065f46; }
        
        .comanda-itens { list-style: none; margin-bottom: 10px; font-size: 14px; max-height: 120px; overflow-y: auto; }
        .comanda-itens li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #f3f4f6; }
        .comanda-total { font-weight: bold; font-size: 16px; text-align: right; margin-bottom: 10px; }
        
        .card-actions { display: flex; gap: 8px; }
        .btn-action { flex: 1; padding: 8px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .btn-pay { background: var(--success); color: white; }
        .btn-delete { background: var(--danger); color: white; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>BBchurrasco 🥩</h2>
        <form id="login-form">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="login-email" required placeholder="admin@bbchurrasco.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="login-password" required placeholder="Sua senha">
            </div>
            <button type="submit" class="btn">Entrar</button>
            <div id="login-error" class="error-msg"></div>
        </form>
    </div>

    <div id="app-screen" class="hidden">
        <header>
            <div>
                <h3>BBchurrasco</h3>
                <div class="user-info">Login: <span id="user-display"></span></div>
            </div>
            <button class="btn-logout" id="btn-logout">Sair</button>
        </header>

        <div class="actions-bar">
            <button class="btn-new" id="btn-nova-comanda">+ Novo Pedido</button>
        </div>

        <div class="comandas-grid" id="comandas-container"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBP_3bvi9PnViCPkIQqEdoF1I7BcItfHEY",
            authDomain: "bbchurrasco-app.firebaseapp.com",
            projectId: "bbchurrasco-app",
            storageBucket: "bbchurrasco-app.firebasestorage.app",
            messagingSenderId: "470656170967",
            appId: "1:470656170967:web:f9c96614d411561ddfe992",
            measurementId: "G-C0KJ5GJKG2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isAdmin = false;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                isAdmin = user.email.toLowerCase().includes('admin');
                document.getElementById('user-display').textContent = user.email;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                carregarComandas();
            } else {
                document.getElementById('app-screen').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const senha = document.getElementById('login-password').value;
            try { await signInWithEmailAndPassword(auth, email, senha); } 
            catch (error) { document.getElementById('login-error').textContent = "Erro no login."; }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        document.getElementById('btn-nova-comanda').addEventListener('click', async () => {
            const mesa = prompt("Mesa/Cliente:");
            if (!mesa) return;
            await addDoc(collection(db, "comandas"), {
                mesa: mesa, itens: [{ nome: "Pedido", qtd: 1, valor: 10.00 }], total: 10.00, status: "aberto"
            });
        });

        function carregarComandas() {
            onSnapshot(collection(db, "comandas"), (snapshot) => {
                const container = document.getElementById('comandas-container');
                container.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    const c = docSnap.data();
                    const card = document.createElement('div');
                    card.className = `comanda-card ${c.status === 'pago' ? 'pago' : ''}`;
                    card.innerHTML = `
                        <div class="comanda-header"><strong>Mesa: ${c.mesa}</strong> <span>${c.status}</span></div>
                        <div class="comanda-total">Total: R$ ${c.total.toFixed(2)}</div>
                        <div class="card-actions">
                            ${c.status !== 'pago' ? `<button class="btn-action btn-pay" onclick="window.pago('${docSnap.id}')">Pagar</button>` : ''}
                            ${isAdmin ? `<button class="btn-action btn-delete" onclick="window.del('${docSnap.id}')">Excluir</button>` : ''}
                        </div>`;
                    container.appendChild(card);
                });
            });
        }
        window.pago = async (id) => await updateDoc(doc(db, "comandas", id), { status: "pago" });
        window.del = async (id) => await deleteDoc(doc(db, "comandas", id));
    </script>
</body>
</html>
